name: Dagster CI

on:
  push:
    branches:
      - develop 
  pull_request:


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Versión estable recomendada

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dagster dagster-webserver pandas plotnine openpyxl pytest

    - name: Lint with flake8
      run: |
        pip install flake8
        # Detiene la build si hay errores de sintaxis de Python
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Dagster Check
      run: |
        # Valida que las definiciones de Dagster carguen correctamente
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        dagster definitions validate -m dagster_app.definitions